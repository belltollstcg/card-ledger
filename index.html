<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a5bd7"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Card Ledger</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--card:#f4f4f2;--ac:#2a5bd7;--bd:#ddd;--ok:#1a7f45;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#9a9a9a;--card:#232323;--ac:#7aa2ff;--bd:#383838;--ok:#4cc380;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;max-width:560px;padding:14px}
h1{font-size:20px}.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1 1 auto;padding:10px 2px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,textarea{width:100%;padding:10px;margin-top:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;font-size:16px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
a.btn{display:block;text-align:center;text-decoration:none}
.msg{font-size:14px;color:var(--mut);margin:8px 0;min-height:20px}
.item{background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0}.item small{color:var(--mut)}
.card{display:flex;gap:12px;align-items:center;cursor:pointer}.card .info{flex:1;min-width:0}
.thumb{width:56px;height:84px;border-radius:6px;object-fit:cover;background:var(--bd);flex:none}
.chev{font-size:24px;color:var(--mut)}.big{width:100%;max-height:360px;object-fit:contain;border-radius:10px;background:var(--card)}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}label+input,label+select,label+textarea{margin-top:3px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.warn{border:1px solid var(--bad);margin-top:12px}.warn .dup{border-top:1px solid var(--bd);padding:8px 0;font-size:15px}.warn .dup:first-child{margin-top:8px}
.pos{color:var(--ok)}.neg{color:var(--bad)}[hidden]{display:none!important}
</style></head><body>
<h1>Card Ledger</h1>
<section id="login"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="go">Sign in</button><div class="msg" id="lmsg"></div></section>
<main id="app" hidden>
<div class="tabs"><button data-t="buy" class="on">Buy</button><button data-t="sell">Sell</button><button data-t="inv">Inventory</button><button data-t="look">Look up</button><button data-t="exp">Expenses</button></div>
<section id="buy">
 <div class="row"><button class="btn alt" data-pick="bcam">📷 Take photo</button><button class="btn alt" data-pick="blib">🖼️ Choose photo</button></div>
 <input id="bcam" type="file" accept="image/*" capture="environment" hidden><input id="blib" type="file" accept="image/*" hidden>
 <div class="msg" id="bmsg">Photo the slab to fill in the details.</div>
 <div class="row"><input id="bg" placeholder="Grader"><input id="bgr" placeholder="Grade"></div>
 <input id="bc" placeholder="Cert number" inputmode="numeric"><input id="bn" placeholder="Card name"><input id="bs" placeholder="Set / year">
 <div class="row"><input id="bp" type="number" step="0.01" placeholder="Price paid $" inputmode="decimal"><input id="bf" type="number" step="0.01" placeholder="Fees $" inputmode="decimal"></div>
 <input id="bd" type="date"><button class="btn" id="bsave">Save to inventory</button>
 <div id="bdup" class="item warn" hidden><b id="bdupmsg"></b><div id="bduplist"></div>
  <div class="row"><button class="btn" id="bdupsave">Save anyway (new purchase)</button><button class="btn alt" id="bdupcancel">Cancel</button></div></div>
</section>
<section id="sell" hidden>
 <div class="row"><button class="btn alt" data-pick="scam">📷 Take photo</button><button class="btn alt" data-pick="slib">🖼️ Choose photo</button></div>
 <input id="scam" type="file" accept="image/*" capture="environment" hidden><input id="slib" type="file" accept="image/*" hidden>
 <div class="msg" id="smsg">Photo the slab to find it, or pick it below.</div>
 <select id="ssel"></select>
 <div class="row"><input id="sp" type="number" step="0.01" placeholder="Sold for $" inputmode="decimal"><input id="sf" type="number" step="0.01" placeholder="Fees $" inputmode="decimal"></div>
 <input id="sd" type="date"><button class="btn" id="ssave">Mark as sold</button>
</section>
<section id="inv" hidden><div id="stats" class="item"></div><div id="list"></div><button class="btn alt" id="csv">Export CSV</button>
 <button class="btn alt" id="backup">Backup everything (zip)</button><div class="msg" id="bkmsg"></div>
 <button class="btn alt" id="out">Sign out</button></section>
<section id="exp" hidden>
 <div class="row"><button class="btn alt" data-pick="xcam">📷 Take photo</button><button class="btn alt" data-pick="xlib">🖼️ Choose photo</button></div>
 <input id="xcam" type="file" accept="image/*" capture="environment" hidden><input id="xlib" type="file" accept="image/*" hidden>
 <div class="msg" id="xmsg">Photo a receipt to fill in the details.</div>
 <input id="xv" placeholder="Vendor">
 <div class="row"><div><label>Date</label><input id="xd" type="date"></div><div><label>Time (optional)</label><input id="xt" type="time"></div></div>
 <div class="row"><input id="xa" type="number" step="0.01" placeholder="Amount $" inputmode="decimal"><input id="xx" type="number" step="0.01" placeholder="Tax $" inputmode="decimal"></div>
 <select id="xc" data-cats></select>
 <input id="xp" placeholder="Payment method">
 <textarea id="xn" rows="2" placeholder="Notes"></textarea>
 <button class="btn" id="xsave">Save expense</button>
 <label>Year</label><select id="xyear"></select>
 <div id="xstats" class="item"></div>
 <div id="xlist"></div>
 <button class="btn alt" id="xcsv">Export expenses CSV</button>
</section>
<section id="xedit" hidden>
 <img id="xeimg" class="big" alt="" hidden>
 <label>Vendor</label><input id="xev">
 <div class="row"><div><label>Date</label><input id="xed" type="date"></div><div><label>Time (optional)</label><input id="xet" type="time"></div></div>
 <div class="row"><div><label>Amount $</label><input id="xea" type="number" step="0.01" inputmode="decimal"></div><div><label>Tax $</label><input id="xex" type="number" step="0.01" inputmode="decimal"></div></div>
 <label>Category</label><select id="xec" data-cats></select>
 <label>Payment method</label><input id="xep">
 <label>Notes</label><textarea id="xen" rows="3"></textarea>
 <div class="msg" id="xemsg"></div>
 <button class="btn" id="xesave">Save changes</button><button class="btn alt" id="xecancel">Cancel</button><button class="btn danger" id="xedel">Delete expense</button>
</section>
<section id="look" hidden>
 <div class="row"><button class="btn alt" data-pick="kcam">📷 Take photo</button><button class="btn alt" data-pick="klib">🖼️ Choose photo</button></div>
 <input id="kcam" type="file" accept="image/*" capture="environment" hidden><input id="klib" type="file" accept="image/*" hidden>
 <div class="msg" id="kmsg">Photo a slab, or type the details, to look it up.</div>
 <div class="row"><input id="kg" placeholder="Grader"><input id="kgr" placeholder="Grade"></div>
 <input id="kc" placeholder="Cert number" inputmode="numeric"><input id="kn" placeholder="Card name"><input id="ks" placeholder="Set / year">
 <div id="klinks" hidden>
  <div class="item"><small>Search text</small><br><b id="kphrase"></b></div>
  <a class="btn" id="ksold" target="_blank" rel="noopener">eBay sold listings</a>
  <a class="btn" id="kact" target="_blank" rel="noopener">eBay active listings</a>
  <div class="row"><a class="btn" id="kcl" target="_blank" rel="noopener">Card Ladder</a><button class="btn alt" data-copy>Copy search text</button></div>
  <div class="row"><a class="btn" id="kalt" target="_blank" rel="noopener">ALT</a><button class="btn alt" data-copy>Copy search text</button></div>
 </div>
 <a class="btn alt" id="kcert" target="_blank" rel="noopener" hidden>Cert page</a>
</section>
<section id="edit" hidden>
 <img id="eimg" class="big" alt="" hidden>
 <div class="row"><div><label>Grader</label><input id="eg"></div><div><label>Grade</label><input id="egr"></div></div>
 <label>Cert number</label><input id="ec" inputmode="numeric">
 <label>Card name</label><input id="en"><label>Set / year</label><input id="es">
 <div class="row"><div><label>Price paid $</label><input id="ep" type="number" step="0.01" inputmode="decimal"></div><div><label>Buy fees $</label><input id="ef" type="number" step="0.01" inputmode="decimal"></div></div>
 <label>Date bought</label><input id="ed" type="date">
 <label>Status</label><select id="est"><option value="inventory">In stock</option><option value="sold">Sold</option></select>
 <div id="esold"><div class="row"><div><label>Sold for $</label><input id="esp" type="number" step="0.01" inputmode="decimal"></div><div><label>Sell fees $</label><input id="esf" type="number" step="0.01" inputmode="decimal"></div></div>
 <label>Date sold</label><input id="esd" type="date"></div>
 <div class="msg" id="emsg"></div>
 <button class="btn" id="esave">Save changes</button><button class="btn alt" id="elook">Look up</button><button class="btn alt" id="ecancel">Cancel</button><button class="btn danger" id="edel">Delete card</button>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
// Paste from Supabase: Project Settings > API
const SUPABASE_URL='https://drqialhskknzigrkquli.supabase.co', SUPABASE_KEY='sb_publishable_SCAc5QwrIRwUITNx1Ha9Kw_EDY_iE_X';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const money=n=>'$'+(Number(n)||0).toFixed(2),today=()=>ymd(new Date());
const csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"',toCsv=(head,rows)=>[head.join(','),...rows.map(r=>r.map(csvq).join(','))].join('\n');
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
const profit=c=>(c.sold_for||0)-(c.sell_fees||0)-(c.cost||0)-(c.buy_fees||0);
let cards=[],bblob=null;$('#bd').value=today();$('#sd').value=today();

const TABS=['buy','sell','inv','look','exp'];
function showTab(t){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  TABS.forEach(x=>$('#'+x).hidden=x!==t)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>$('#'+b.dataset.pick).click());

$('#go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)$('#lmsg').textContent=error.message};
$('#out').onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((_e,s)=>{$('#login').hidden=!!s;$('#app').hidden=!s;if(s)load()});
sb.auth.getSession().then(({data})=>{if(data.session){$('#login').hidden=true;$('#app').hidden=false;load()}});

async function shrink(file){const img=await createImageBitmap(file),k=Math.min(1,1280/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
async function readSlab(blob){const{data,error}=await sb.functions.invoke('read-slab',{body:{image:await b64(blob)}});if(error)throw error;return data||{}}

async function onBuy(e){const f=e.target.files[0];if(!f)return;bblob=await shrink(f);$('#bmsg').textContent='Reading slab…';
  try{const d=await readSlab(bblob);$('#bg').value=d.grader||'';$('#bgr').value=d.grade||'';$('#bc').value=d.cert||'';$('#bn').value=d.name||'';$('#bs').value=d.set||'';$('#bmsg').textContent='Check details, add price paid.'}
  catch{$('#bmsg').textContent='Could not read photo. Enter by hand.'}}
$('#bcam').onchange=onBuy;$('#blib').onchange=onBuy;

const hideDup=()=>$('#bdup').hidden=true;
$('#bc').addEventListener('input',hideDup);$('#bdupcancel').onclick=()=>{hideDup();$('#bmsg').textContent='Not saved.'};
$('#bsave').onclick=async()=>{const cert=$('#bc').value.trim();hideDup();
  if(!cert||!$('#bp').value){$('#bmsg').textContent='Cert number and price paid are required.';return}
  $('#bsave').disabled=true;$('#bmsg').textContent='Checking for this cert…';
  const{data:dups,error}=await sb.from('cards').select('grader,grade,name,bought_on,cost,status,sold_on,sold_for').eq('cert',cert).order('bought_on');
  $('#bsave').disabled=false;
  if(error){$('#bmsg').textContent='Could not check for duplicates: '+error.message;return}
  if(!dups.length)return saveBuy(cert);
  $('#bdupmsg').textContent=dups.some(c=>c.status==='inventory')?'This cert is already in your inventory. You may have scanned it twice.':"You've owned this card before. Buying it back?";
  $('#bduplist').innerHTML=dups.map(c=>`<div class="dup">${esc(c.grader)} ${esc(c.grade)} – ${esc(c.name)}<br><small>Bought ${esc(c.bought_on||'?')} for ${money(c.cost)} · ${c.status==='sold'?`Sold ${esc(c.sold_on||'?')} for ${money(c.sold_for)}`:'In stock'}</small></div>`).join('');
  $('#bmsg').textContent='Not saved yet. A card with cert '+cert+' already exists.';$('#bdup').hidden=false;$('#bdup').scrollIntoView({block:'nearest'})};
$('#bdupsave').onclick=()=>{hideDup();saveBuy($('#bc').value.trim())};
async function saveBuy(cert){$('#bsave').disabled=true;$('#bmsg').textContent='Saving…';try{await insertBuy(cert)}finally{$('#bsave').disabled=false}}
async function insertBuy(cert){
  let photo=null;
  if(bblob){const u=(await sb.auth.getUser()).data.user,path=u.id+'/'+Date.now()+'.jpg';
    const up=await sb.storage.from('slabs').upload(path,bblob,{contentType:'image/jpeg'});if(!up.error)photo=path}
  const{error}=await sb.from('cards').insert({cert,grader:$('#bg').value.trim(),grade:$('#bgr').value.trim(),name:$('#bn').value.trim(),set_name:$('#bs').value.trim(),
    cost:+$('#bp').value||0,buy_fees:+$('#bf').value||0,bought_on:$('#bd').value,photo});
  if(error){$('#bmsg').textContent='Save failed: '+error.message;return}
  ['bg','bgr','bc','bn','bs','bp','bf','bcam','blib'].forEach(i=>$('#'+i).value='');bblob=null;$('#bmsg').textContent='Saved. Ready for the next card.';load()}

// Sell: only in-stock cards match; if several share the cert, narrow the list and make the user pick
let sellMatch=null;
async function onSell(e){const f=e.target.files[0];e.target.value='';if(!f)return;$('#smsg').textContent='Reading slab…';sellMatch=null;
  try{const d=await readSlab(await shrink(f)),cert=String(d.cert??'').trim(),
      ms=cert?cards.filter(c=>c.status==='inventory'&&String(c.cert).trim()===cert):[];
    if(ms.length>1){sellMatch=ms;$('#smsg').textContent=ms.length+' in-stock cards have cert '+cert+'. Pick which one you sold.'}
    else if(ms.length){$('#smsg').textContent='Matched: '+ms[0].name+'. Enter the sale price.'}
    else $('#smsg').textContent='No in-stock card with cert '+(cert||'?')+'. Pick it below.';
    renderSell();if(ms.length)$('#ssel').value=ms.length===1?ms[0].id:''}
  catch{renderSell();$('#smsg').textContent='Could not read photo. Pick the card below.'}}
$('#scam').onchange=onSell;$('#slib').onchange=onSell;
$('#ssel').onchange=()=>{if($('#ssel').value==='__all'){sellMatch=null;renderSell();$('#smsg').textContent='Pick the card below.'}};
function renderSell(){const st=cards.filter(c=>c.status==='inventory'),keep=$('#ssel').value,
    n={};st.forEach(c=>n[c.cert]=(n[c.cert]||0)+1),
    opt=c=>`<option value="${esc(c.id)}">${esc(c.grader)} ${esc(c.grade)} – ${esc(c.name)} (#${esc(c.cert)})${n[c.cert]>1?` · bought ${esc(c.bought_on||'?')} for ${money(c.cost)}`:''}</option>`;
  const list=sellMatch?st.filter(c=>sellMatch.some(m=>m.id===c.id)):st;
  $('#ssel').innerHTML=sellMatch?'<option value="">Pick which one…</option>'+list.map(opt).join('')+'<option value="__all">Show all in-stock cards</option>'
    :st.map(opt).join('')||'<option value="">No cards in inventory</option>';
  if([...$('#ssel').options].some(o=>o.value===keep&&keep!=='__all'))$('#ssel').value=keep}
$('#ssave').onclick=async()=>{const id=$('#ssel').value;if(!id||id==='__all'||!$('#sp').value){$('#smsg').textContent='Pick a card and enter the sale price.';return}
  const{error}=await sb.from('cards').update({status:'sold',sold_for:+$('#sp').value||0,sell_fees:+$('#sf').value||0,sold_on:$('#sd').value}).eq('id',id);
  if(error){$('#smsg').textContent='Save failed: '+error.message;return}
  $('#sp').value='';$('#sf').value='';$('#scam').value='';$('#slib').value='';sellMatch=null;$('#smsg').textContent='Marked as sold.';load()};

async function load(){loadExpenses();const{data}=await sb.from('cards').select('*').order('created_at',{ascending:false});cards=data||[];
  const paths=cards.map(c=>c.photo).filter(p=>p&&!urls[p]);
  if(paths.length){const{data:sg}=await sb.storage.from('slabs').createSignedUrls(paths,86400);(sg||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl})}
  render()}
function render(){const sold=cards.filter(c=>c.status==='sold'),st=cards.filter(c=>c.status==='inventory');
  $('#stats').innerHTML=`In stock ${st.length} · ${money(st.reduce((a,c)=>a+c.cost+c.buy_fees,0))}<br>Sold ${sold.length} · ${money(sold.reduce((a,c)=>a+c.sold_for,0))}<br>Net profit <b class="${sold.reduce((a,c)=>a+profit(c),0)>=0?'pos':'neg'}">${money(sold.reduce((a,c)=>a+profit(c),0))}</b>`;
  $('#list').innerHTML=cards.map(c=>`<div class="item card" data-id="${esc(c.id)}">${urls[c.photo]?`<img class="thumb" src="${esc(urls[c.photo])}" alt="">`:'<div class="thumb"></div>'}<div class="info"><b>${esc(c.grader)} ${esc(c.grade)} – ${esc(c.name)}</b><br><small>#${esc(c.cert)} · ${esc(c.set_name)}</small><br>Bought ${money(c.cost)} on ${esc(c.bought_on)}${c.status==='sold'?`<br>Sold ${money(c.sold_for)} on ${esc(c.sold_on)} · <span class="${profit(c)>=0?'pos':'neg'}">${money(profit(c))}</span>`:' · <small>in stock</small>'}</div><span class="chev">›</span></div>`).join('')||'<div class="msg">No cards yet.</div>';
  renderSell()}
const CARD_COLS=['cert','grader','grade','name','set_name','bought_on','cost','buy_fees','status','sold_on','sold_for','sell_fees'];
const cardsCsv=(list,files)=>toCsv([...CARD_COLS,'profit',...(files?['photo_file']:[])],
  list.map(c=>[...CARD_COLS.map(k=>c[k]),c.status==='sold'?profit(c).toFixed(2):'',...(files?[files.get(c.id)||'']:[])]));
$('#csv').onclick=()=>dl(new Blob([cardsCsv(cards)],{type:'text/csv'}),'card-ledger.csv');

let urls={},editing=null;
$('#list').onclick=e=>{const el=e.target.closest('[data-id]');if(el)openEdit(el.dataset.id)};
function openEdit(id){const c=cards.find(x=>x.id===id);if(!c)return;editing=c;
  const v={eg:c.grader,egr:c.grade,ec:c.cert,en:c.name,es:c.set_name,ep:c.cost,ef:c.buy_fees,ed:c.bought_on,est:c.status,esp:c.sold_for,esf:c.sell_fees,esd:c.sold_on||today()};
  Object.entries(v).forEach(([k,x])=>$('#'+k).value=x??'');
  const u=urls[c.photo];$('#eimg').hidden=!u;if(u)$('#eimg').src=u;
  $('#esold').hidden=c.status!=='sold';$('#emsg').textContent='';
  TABS.forEach(t=>$('#'+t).hidden=true);$('.tabs').hidden=true;$('#edit').hidden=false;scrollTo(0,0)}
function closeEdit(){editing=null;$('#edit').hidden=true;$('.tabs').hidden=false;$('#inv').hidden=false}
$('#est').onchange=()=>$('#esold').hidden=$('#est').value!=='sold';
$('#ecancel').onclick=closeEdit;
$('#elook').onclick=()=>{const c=editing;closeEdit();fillLook({grader:c.grader,grade:c.grade,cert:c.cert,name:c.name,set:c.set_name});
  $('#kmsg').textContent='Saved details for this card. Edit to refine the search.';showTab('look');scrollTo(0,0)};

// Look up: build price-check and cert links from the slab details
const enc=encodeURIComponent;
const LINKS={
  ebaySold:p=>'https://www.ebay.com/sch/i.html?_nkw='+enc(p)+'&LH_Sold=1&LH_Complete=1',
  ebayActive:p=>'https://www.ebay.com/sch/i.html?_nkw='+enc(p),
  cardLadder:p=>'https://www.cardladder.com/ladder?category=Pokemon&query='+enc(p),
  alt:p=>'https://alt.xyz/browse?query='+enc(p)};
function certLink(grader,cert){const g=grader.toUpperCase().replace(/[^A-Z]/g,''),c=enc(cert);if(!cert)return null;
  if(g.startsWith('PSA'))return{label:'PSA cert page',url:'https://www.psacard.com/cert/'+c};
  if(g.startsWith('CGC'))return{label:'CGC cert page',url:'https://www.cgccards.com/certlookup/'+c+'/'};
  const t=g.startsWith('BVG')?'BVG':g.startsWith('BCCG')?'BCCG':/^(BGS|BECKETT)/.test(g)?'BGS':null;
  return t&&{label:'Beckett cert page',url:'https://www.beckett.com/grading/card-lookup?item_id='+c+'&item_type='+t}}
const kf={grader:'kg',grade:'kgr',cert:'kc',name:'kn',set:'ks'},kv=k=>$('#'+kf[k]).value.trim();
function fillLook(d){Object.entries(kf).forEach(([k,id])=>$('#'+id).value=d[k]||'');updateLook()}
function updateLook(){const p=['name','set','grader','grade'].map(kv).filter(Boolean).join(' ').replace(/\s+/g,' ');
  $('#klinks').hidden=!p;$('#kphrase').textContent=p;
  if(p){$('#ksold').href=LINKS.ebaySold(p);$('#kact').href=LINKS.ebayActive(p);$('#kcl').href=LINKS.cardLadder(p);$('#kalt').href=LINKS.alt(p)}
  const cl=certLink(kv('grader'),kv('cert'));$('#kcert').hidden=!cl;if(cl){$('#kcert').href=cl.url;$('#kcert').textContent=cl.label}}
Object.values(kf).forEach(id=>$('#'+id).oninput=updateLook);
async function onLook(e){const f=e.target.files[0];e.target.value='';if(!f)return;$('#kmsg').textContent='Reading slab…';
  try{fillLook(await readSlab(await shrink(f)));$('#kmsg').textContent='Check the details and fix any misreads.'}
  catch{$('#kmsg').textContent='Could not read photo. Enter the details by hand.'}}
$('#kcam').onchange=onLook;$('#klib').onchange=onLook;
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch{
  const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
  const ok=document.execCommand('copy');a.remove();return ok}}
document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const ok=await copyText($('#kphrase').textContent);
  b.textContent=ok?'Copied ✓':'Copy failed';clearTimeout(b._t);b._t=setTimeout(()=>b.textContent='Copy search text',1500)});
$('#esave').onclick=async()=>{const cert=$('#ec').value.trim(),sold=$('#est').value==='sold';
  if(!cert){$('#emsg').textContent='Cert number is required.';return}
  if(sold&&!$('#esp').value){$('#emsg').textContent='Enter the sale price.';return}
  const{error}=await sb.from('cards').update({cert,grader:$('#eg').value.trim(),grade:$('#egr').value.trim(),name:$('#en').value.trim(),set_name:$('#es').value.trim(),
    cost:+$('#ep').value||0,buy_fees:+$('#ef').value||0,bought_on:$('#ed').value||null,status:$('#est').value,
    sold_for:sold?(+$('#esp').value||0):null,sell_fees:sold?(+$('#esf').value||0):0,sold_on:sold?($('#esd').value||null):null}).eq('id',editing.id);
  if(error){$('#emsg').textContent='Save failed: '+error.message;return}
  closeEdit();load()};
$('#edel').onclick=async()=>{if(!confirm('Delete this card permanently?'))return;
  if(editing.photo)await sb.storage.from('slabs').remove([editing.photo]);
  const{error}=await sb.from('cards').delete().eq('id',editing.id);
  if(error){$('#emsg').textContent='Delete failed: '+error.message;return}
  closeEdit();load()};

// ---------- Expenses ----------
const CATS=['Grading fees','Shipping and postage','Supplies','Selling and platform fees','Travel','Meals','Show and booth fees','Software and subscriptions','Other'];
document.querySelectorAll('[data-cats]').forEach(s=>s.innerHTML='<option value="">Category…</option>'+CATS.map(c=>`<option>${esc(c)}</option>`).join(''));
// form field ids: new-expense form uses "x"+suffix, edit screen uses "xe"+suffix
const XF={vendor:'v',expense_date:'d',expense_time:'t',amount:'a',tax:'x',category:'c',payment_method:'p',notes:'n'};
function getX(p){const g=k=>$('#'+p+XF[k]).value.trim();
  return{vendor:g('vendor'),expense_date:g('expense_date')||null,expense_time:g('expense_time')||null,amount:+g('amount')||0,tax:+g('tax')||0,
    category:g('category')||'Other',payment_method:g('payment_method'),notes:g('notes')}}
function setX(p,e){Object.entries(XF).forEach(([k,s])=>$('#'+p+s).value=e[k]??'')}
function checkX(p){if(!$('#'+p+'a').value)return'Enter the amount.';if(!$('#'+p+'d').value)return'Enter the date.';return''}
// normalise what read-receipt returns into ISO date, HH:MM time, numbers and one of our categories
function isoDate(s){if(!s)return'';const m=String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  const d=new Date(s);return isNaN(d)?'':ymd(d)}
function hhmm(s){const m=String(s??'').match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap])?/i);if(!m)return'';let h=+m[1];
  if(m[3])h=h%12+(/p/i.test(m[3])?12:0);return h<24&&+m[2]<60?pad(h)+':'+m[2]:''}
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isNaN(n)?'':n.toFixed(2)};
function matchCat(c){const l=String(c??'').trim().toLowerCase();if(!l)return'';
  return CATS.find(x=>x.toLowerCase()===l)||CATS.find(x=>x.toLowerCase().split(/\W+/).some(w=>w.length>3&&w!=='fees'&&l.includes(w)))||'Other'}

let expenses=[],rurls={},xblob=null,xraw=null,xediting=null;$('#xd').value=today();
async function onReceipt(e){const f=e.target.files[0];e.target.value='';if(!f)return;xblob=await shrink(f);xraw=null;$('#xmsg').textContent='Reading receipt…';
  try{const{data,error}=await sb.functions.invoke('read-receipt',{body:{image:await b64(xblob)}});if(error)throw error;const d=data||{};xraw=d;
    setX('x',{vendor:d.vendor||'',expense_date:isoDate(d.date)||today(),expense_time:hhmm(d.time),amount:num(d.total),tax:num(d.tax),
      category:matchCat(d.category),payment_method:d.payment_method||'',notes:d.summary||''});
    $('#xmsg').textContent='Check the details, then save.'}
  catch{$('#xmsg').textContent='Could not read receipt. Enter the details by hand.'}}
$('#xcam').onchange=onReceipt;$('#xlib').onchange=onReceipt;
$('#xsave').onclick=async()=>{const bad=checkX('x');if(bad){$('#xmsg').textContent=bad;return}
  $('#xsave').disabled=true;$('#xmsg').textContent='Saving…';
  try{let photo=null;
    if(xblob){const u=(await sb.auth.getUser()).data.user,path=u.id+'/'+Date.now()+'.jpg';
      const up=await sb.storage.from('receipts').upload(path,xblob,{contentType:'image/jpeg'});
      if(up.error){$('#xmsg').textContent='Photo upload failed: '+up.error.message;return}photo=path}
    const{error}=await sb.from('expenses').insert({...getX('x'),photo,raw:xraw});
    if(error){if(photo)sb.storage.from('receipts').remove([photo]);$('#xmsg').textContent='Save failed: '+error.message;return}
    setX('x',{expense_date:today()});xblob=null;xraw=null;$('#xmsg').textContent='Saved. Ready for the next receipt.';loadExpenses()}
  finally{$('#xsave').disabled=false}};

const xsort=(a,b)=>(b.expense_date||'').localeCompare(a.expense_date||'')||(b.expense_time||'').localeCompare(a.expense_time||'')||String(b.created_at).localeCompare(String(a.created_at));
async function loadExpenses(){const{data,error}=await sb.from('expenses').select('*');if(error){$('#xstats').textContent='Could not load expenses: '+error.message;return}
  expenses=(data||[]).sort(xsort);
  const paths=expenses.map(e=>e.photo).filter(p=>p&&!rurls[p]);
  if(paths.length){const{data:sg}=await sb.storage.from('receipts').createSignedUrls(paths,86400);(sg||[]).forEach(x=>{if(x.signedUrl)rurls[x.path]=x.signedUrl})}
  renderExpenses()}
const yearOf=e=>(e.expense_date||'').slice(0,4);
function renderExpenses(){const cur=String(new Date().getFullYear()),keep=$('#xyear').value||cur;
  const years=[...new Set([cur,keep,...expenses.map(yearOf).filter(Boolean)])].sort().reverse();
  $('#xyear').innerHTML=years.map(y=>`<option>${esc(y)}</option>`).join('');$('#xyear').value=keep;
  const list=expenses.filter(e=>yearOf(e)===keep),tot={};list.forEach(e=>tot[e.category||'Other']=(tot[e.category||'Other']||0)+(+e.amount||0));
  $('#xstats').innerHTML=`<b>${esc(keep)} total ${money(list.reduce((a,e)=>a+(+e.amount||0),0))}</b> · ${list.length} expense${list.length===1?'':'s'}`+
    Object.entries(tot).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<br>${esc(c)} <small>${money(v)}</small>`).join('');
  $('#xlist').innerHTML=list.map(e=>`<div class="item card" data-xid="${esc(e.id)}">${rurls[e.photo]?`<img class="thumb" src="${esc(rurls[e.photo])}" alt="">`:'<div class="thumb"></div>'}<div class="info"><b>${esc(e.vendor||'(no vendor)')}</b><br><small>${esc(e.expense_date)}${e.expense_time?' '+esc(String(e.expense_time).slice(0,5)):''} · ${esc(e.category)}</small><br>${money(e.amount)}</div><span class="chev">›</span></div>`).join('')||'<div class="msg">No expenses for '+esc(keep)+'.</div>'}
$('#xyear').onchange=renderExpenses;

$('#xlist').onclick=e=>{const el=e.target.closest('[data-xid]');if(el)openXEdit(el.dataset.xid)};
function openXEdit(id){const x=expenses.find(e=>e.id===id);if(!x)return;xediting=x;
  setX('xe',{...x,expense_time:x.expense_time?String(x.expense_time).slice(0,5):'',category:CATS.includes(x.category)?x.category:'Other'});
  const u=rurls[x.photo];$('#xeimg').hidden=!u;if(u)$('#xeimg').src=u;$('#xemsg').textContent='';
  TABS.forEach(t=>$('#'+t).hidden=true);$('.tabs').hidden=true;$('#xedit').hidden=false;scrollTo(0,0)}
function closeXEdit(){xediting=null;$('#xedit').hidden=true;$('.tabs').hidden=false;$('#exp').hidden=false}
$('#xecancel').onclick=closeXEdit;
$('#xesave').onclick=async()=>{const bad=checkX('xe');if(bad){$('#xemsg').textContent=bad;return}
  const{error}=await sb.from('expenses').update(getX('xe')).eq('id',xediting.id);
  if(error){$('#xemsg').textContent='Save failed: '+error.message;return}
  closeXEdit();loadExpenses()};
$('#xedel').onclick=async()=>{if(!confirm('Delete this expense and its receipt photo permanently?'))return;
  if(xediting.photo){const{error}=await sb.storage.from('receipts').remove([xediting.photo]);if(error){$('#xemsg').textContent='Could not delete photo: '+error.message;return}}
  const{error}=await sb.from('expenses').delete().eq('id',xediting.id);
  if(error){$('#xemsg').textContent='Delete failed: '+error.message;return}
  closeXEdit();loadExpenses()};

const EXP_COLS=['expense_date','expense_time','vendor','category','amount','tax','payment_method','notes'];
const expCsv=(list,files)=>toCsv([...EXP_COLS,...(files?['photo_file']:[])],list.map(e=>[...EXP_COLS.map(k=>k==='expense_time'&&e[k]?String(e[k]).slice(0,5):e[k]),...(files?[files.get(e.id)||'']:[])]));
$('#xcsv').onclick=()=>{const y=$('#xyear').value;dl(new Blob([expCsv(expenses.filter(e=>yearOf(e)===y).reverse())],{type:'text/csv'}),'card-ledger-expenses-'+y+'.csv')};

// ---------- Backup: one zip with both CSVs and every photo ----------
let jszipP=null;
const loadJSZip=()=>jszipP||=new Promise((ok,fail)=>{const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=()=>ok(window.JSZip);
  s.onerror=()=>{jszipP=null;s.remove();fail(new Error('Could not load JSZip'))};document.head.appendChild(s)});
const slug=s=>String(s??'').normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9.]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
$('#backup').onclick=async()=>{const btn=$('#backup'),say=t=>$('#bkmsg').textContent=t;btn.disabled=true;
  try{say('Loading zip library…');const JSZip=await loadJSZip();
    say('Reading cards and expenses…');
    const[c,x]=await Promise.all([sb.from('cards').select('*').order('bought_on'),sb.from('expenses').select('*')]);
    if(c.error||x.error)throw c.error||x.error;
    const allCards=c.data||[],allExp=(x.data||[]).sort(xsort).reverse(),zip=new JSZip(),used=new Set(),files=new Map(),missing=[];
    const fname=(dir,parts,path)=>{const ext=(path.match(/\.[A-Za-z0-9]+$/)||['.jpg'])[0].toLowerCase(),base=dir+'/'+(parts.map(slug).filter(Boolean).join('_')||'photo');
      let n=base+ext,i=2;while(used.has(n))n=base+'-'+i+++ext;used.add(n);return n};
    const jobs=[...allCards.filter(r=>r.photo).map(r=>({bucket:'slabs',row:r,file:fname('slab-photos',[r.bought_on,r.grader+' '+r.grade,r.name,r.cert],r.photo)})),
      ...allExp.filter(r=>r.photo).map(r=>({bucket:'receipts',row:r,file:fname('receipt-photos',[r.expense_date,r.vendor,num(r.amount)],r.photo)}))];
    const total=jobs.length;let done=0;say(`Downloading photos 0 / ${total}…`);
    const worker=async()=>{for(let j;(j=jobs.shift());){
      const{data,error}=await sb.storage.from(j.bucket).download(j.row.photo);
      if(error||!data)missing.push(`${j.bucket}/${j.row.photo}: ${error?.message||'no data'}`);
      else{zip.file(j.file,data,{binary:true,compression:'STORE'});files.set(j.row.id,j.file)}
      say(`Downloading photos ${++done} / ${total}…`)}};
    await Promise.all(Array.from({length:Math.min(4,total)},worker));
    zip.file('cards.csv',cardsCsv(allCards,files));zip.file('expenses.csv',expCsv(allExp,files));
    if(missing.length)zip.file('missing-photos.txt',missing.join('\n'));
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'},m=>say(`Building zip ${Math.round(m.percent)}%…`));
    dl(blob,'card-ledger-backup-'+today()+'.zip');
    say(`Backup saved: ${allCards.length} cards, ${allExp.length} expenses, ${total-missing.length} of ${total} photos`+(missing.length?` (${missing.length} missing, listed in missing-photos.txt).`:'.'))}
  catch(e){say('Backup failed: '+(e.message||e))}
  finally{btn.disabled=false}};
</script></body></html>
