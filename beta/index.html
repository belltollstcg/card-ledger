<title>Card Ledger</title>

</head><body>
<p>Card Ledger has moved. Opening it now…</p>
<p><a href="../">Open Card Ledger</a></p>
<script>
// The beta is now the main app. Remove the old beta service worker (scope /beta/) and go to the root.
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      for (const r of await navigator.serviceWorker.getRegistrations()) {
        if (/\/beta\/$/.test(r.scope)) await r.unregister();
      }
    }
  } catch (e) {}
  location.replace('../');
})();
</script>
</body></html>
